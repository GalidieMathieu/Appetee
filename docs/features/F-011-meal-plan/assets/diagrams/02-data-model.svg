<rect x="380" y="787" width="101" height="19" fill="#f5f8fc"/>
<text x="385" y="804" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#24334b">0..N meals</text>
<polyline points="680,915 840,915" fill="none" stroke="#66748a" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="692" y="880" width="97" height="19" fill="#f5f8fc"/>
<text x="697" y="897" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#24334b">0..N items</text>
<polyline points="1140,760 1140,845" fill="none" stroke="#66748a" stroke-width="3" marker-end="url(#arrow)"/>
