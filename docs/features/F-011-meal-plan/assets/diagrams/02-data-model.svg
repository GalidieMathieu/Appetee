<text x="50" y="61" font-family="DejaVu Sans, sans-serif" font-size="33" font-weight="700" fill="#24334b">02 / Canonical data relationships</text>
<text x="50" y="99" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#24334b">Six new tables; existing users and recipes remain canonical. A week is a date range.</text>
