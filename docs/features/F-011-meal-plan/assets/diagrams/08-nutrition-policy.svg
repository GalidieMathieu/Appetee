<rect x="375" y="700" width="201" height="23" fill="#f5f8fc"/>
<text x="380" y="717" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#24334b">Atomic Create; receipt</text>
<rect x="510" y="145" width="480" height="130" rx="13" fill="#f1eafb" stroke="#8560b1" stroke-width="2"/>
<text x="530" y="183" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#24334b">Plan mode</text>
<text x="530" y="219" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#24334b">Easy or Intermediate</text>
<rect x="65" y="375" width="590" height="145" rx="13" fill="#f1eafb" stroke="#8560b1" stroke-width="2"/>
<text x="85" y="413" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#24334b">Easy</text>
<text x="85" y="449" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#24334b">Name and default count only</text>
<text x="85" y="478" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#24334b">No profile inputs or target values</text>
<rect x="845" y="375" width="590" height="145" rx="13" fill="#f1eafb" stroke="#8560b1" stroke-width="2"/>
<text x="865" y="413" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#24334b">Intermediate draft</text>
<text x="865" y="449" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#24334b">Profile → Goal → Activity → Meals → Review</text>
<text x="865" y="478" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#24334b">Core API sends validated preview request</text>
<rect x="845" y="650" width="590" height="170" rx="13" fill="#e6f3ee" stroke="#35856a" stroke-width="2"/>
<text x="865" y="688" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#24334b">Server policy preview</text>
<text x="865" y="724" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#24334b">ten Haaf RMR + PAL + goal adjustment</text>
<text x="865" y="753" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#24334b">Protein, fat range and residual carbs</text>
<text x="865" y="782" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#24334b">Targets, warnings, policy version and year</text>
<rect x="845" y="970" width="590" height="170" rx="13" fill="#e6f3ee" stroke="#35856a" stroke-width="2"/>
<text x="865" y="1008" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#24334b">Explicit Create / Recalculate</text>
<text x="865" y="1044" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#24334b">Verify reviewed policy/year; recompute</text>
<text x="865" y="1073" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#24334b">Profile + plan + first Current are atomic</text>
<text x="865" y="1102" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#24334b">Metadata-only edit preserves calculation</text>
<rect x="65" y="970" width="590" height="170" rx="13" fill="#e6f0ff" stroke="#3269ae" stroke-width="2"/>
<text x="85" y="1008" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#24334b">Confirmed core state</text>
<text x="85" y="1044" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#24334b">Complete plan + settings; profile if changed</text>
<text x="85" y="1073" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#24334b">Saved inputs/targets remain authoritative</text>
<text x="85" y="1102" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#24334b">Global profile edits do not recalculate plans</text>
<text x="50" y="1215" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#24334b">Nutrition_Policy.md defines the exact equation, supported inputs, rounding, safeguards and golden vectors.</text>
</svg>