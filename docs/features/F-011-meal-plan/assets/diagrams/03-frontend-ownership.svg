<polyline points="150,405 150,300" fill="none" stroke="#66748a" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="160" y="342" width="116" height="23" fill="#f5f8fc"/>
<text x="165" y="359" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#24334b">readonly VM</text>
<rect x="75" y="145" width="580" height="155" rx="13" fill="#f1eafb" stroke="#8560b1" stroke-width="2"/>
<text x="95" y="183" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#24334b">Feature UI / page.ts</text>
<text x="95" y="219" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#24334b">Composition, focus and intent bindings</text>
<text x="95" y="248" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#24334b">Readonly VM; no DTO arrays or API calls</text>
<text x="95" y="277" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#24334b">No form, queue or nutrition ownership</text>
<rect x="75" y="405" width="580" height="180" rx="13" fill="#f1eafb" stroke="#8560b1" stroke-width="2"/>
<text x="95" y="443" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#24334b">Feature state / models / forms</text>
<text x="95" y="479" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#24334b">Navigation, selection, typed form drafts</text>
<text x="95" y="508" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#24334b">Ephemeral unsaved calculation preview</text>
<text x="95" y="537" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#24334b">Temporary drag / quantity overlays</text>
<text x="95" y="566" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#24334b">Never an authoritative server cache</text>
<rect x="845" y="405" width="580" height="180" rx="13" fill="#e6f0ff" stroke="#3269ae" stroke-width="2"/>
<text x="865" y="443" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#24334b">Core domain facades</text>
<text x="865" y="479" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#24334b">Reusable use cases and readonly selectors</text>
<text x="865" y="508" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#24334b">Core APIs perform transport</text>
<text x="865" y="537" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#24334b">Core coordinator serializes writes</text>
<text x="865" y="566" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#24334b">Core sync applies confirmed receipts</text>
<rect x="845" y="720" width="580" height="180" rx="13" fill="#e6f0ff" stroke="#3269ae" stroke-width="2"/>
<text x="865" y="758" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#24334b">Core confirmed stores</text>
<text x="865" y="794" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#24334b">Planner ranges; plan summaries and details</text>
<text x="865" y="823" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#24334b">Saved nutrition profile; current context</text>
<text x="865" y="852" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#24334b">Separate query state and revision evidence</text>
<text x="865" y="881" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#24334b">Reset through existing identity lifecycle</text>
<rect x="75" y="720" width="580" height="180" rx="13" fill="#e6f0ff" stroke="#3269ae" stroke-width="2"/>
<text x="95" y="758" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#24334b">Core scoped recipe picker</text>
<text x="95" y="794" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#24334b">Applied criteria, cursor and query results</text>
<text x="95" y="823" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#24334b">Provided once per planner workspace</text>
<text x="95" y="852" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#24334b">Isolated from main recipe discovery</text>
<text x="95" y="881" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#24334b">Reset on root identity reset; dispose on exit</text>
<text x="50" y="975" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#24334b">Core never imports features. Feature drafts never replace core domain data. UI never injects writable stores.</text>
</svg>