<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">F-009 Favorites routing</title>
  <desc id="desc">Authenticated routing from Home to Favorites, recipe card to shared Quick Preview, and empty state to Recipes.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #1e1e1e; }
      .subtitle { font: 400 15px Arial, sans-serif; fill: #666; }
      .label { font: 700 18px Arial, sans-serif; fill: #1f1f1f; }
      .small { font: 400 14px Arial, sans-serif; fill: #555; }
      .route { font: 700 15px monospace; fill: #d95700; }
      .box { fill: #fff; stroke: #dedede; stroke-width: 1.5; rx: 14; }
      .accent { fill: #fff5ee; stroke: #ffb47a; stroke-width: 1.5; rx: 14; }
      .shared { fill: #f5f7fa; stroke: #b8c0cc; stroke-width: 1.5; rx: 14; }
      .line { stroke: #555; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #888; stroke-width: 1.7; stroke-dasharray: 7 6; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <text x="55" y="55" class="title">F-009 — Favorites routing</text>
  <text x="55" y="84" class="subtitle">Private authenticated route; Recipe Card interaction remains owned by the shared F-008 Recipe Experience.</text>

  <rect x="60" y="135" width="260" height="110" class="box"/>
  <text x="85" y="172" class="label">Home</text>
  <text x="85" y="202" class="small">Your Favorite Recipes</text>
  <text x="85" y="225" class="small">View all</text>

  <rect x="470" y="125" width="270" height="130" class="accent"/>
  <text x="495" y="164" class="label">Favorites Page</text>
  <text x="495" y="193" class="route">/favorites</text>
  <text x="495" y="222" class="small">authGuard / PrivateLayout</text>

  <rect x="875" y="125" width="260" height="130" class="shared"/>
  <text x="900" y="164" class="label">Shared Recipe Experience</text>
  <text x="900" y="195" class="small">RecipeCard</text>
  <text x="900" y="218" class="small">→ Quick Preview</text>
  <text x="900" y="241" class="small">→ Cooking Mode later</text>

  <path d="M 320 190 L 470 190" class="line"/>
  <text x="355" y="175" class="small">View all</text>

  <path d="M 740 190 L 875 190" class="line"/>
  <text x="775" y="175" class="small">card select</text>

  <rect x="470" y="350" width="270" height="120" class="box"/>
  <text x="495" y="388" class="label">Favorites Empty State</text>
  <text x="495" y="418" class="small">No saved recipes</text>
  <text x="495" y="444" class="small">Explore Recipes</text>

  <rect x="875" y="350" width="260" height="120" class="accent"/>
  <text x="900" y="388" class="label">Recipe Discovery</text>
  <text x="900" y="418" class="route">/recipes</text>
  <text x="900" y="444" class="small">Start normal discovery session</text>

  <path d="M 605 255 L 605 350" class="dash"/>
  <text x="620" y="307" class="small">0 favorites</text>

  <path d="M 740 410 L 875 410" class="line"/>
  <text x="766" y="394" class="small">Explore Recipes</text>

  <rect x="60" y="350" width="260" height="120" class="shared"/>
  <text x="85" y="388" class="label">Favorites API</text>
  <text x="85" y="417" class="route">GET /api/recipes/favorites</text>
  <text x="85" y="444" class="small">?limit=4 for Home preview</text>

  <path d="M 470 225 C 405 265, 360 315, 320 380" class="dash"/>
  <text x="327" y="317" class="small">load list</text>

  <text x="55" y="550" class="subtitle">Mutation routes remain F-008-owned: PUT/DELETE /api/recipes/{recipeId}/favorite.</text>
  <text x="55" y="578" class="subtitle">F-009 adds the collection read route and /favorites page only.</text>
</svg>
