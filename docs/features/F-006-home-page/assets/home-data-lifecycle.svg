<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1450" viewBox="0 0 1400 1450">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#444"/>
    </marker>
    <style>
      .title { font: 700 34px Arial, sans-serif; fill: #111; }
      .subtitle { font: 400 18px Arial, sans-serif; fill: #555; }
      .node { fill: #fff; stroke: #333; stroke-width: 2; rx: 14; }
      .decision { fill: #fff; stroke: #333; stroke-width: 2; }
      .text { font: 600 18px Arial, sans-serif; fill: #111; text-anchor: middle; dominant-baseline: middle; }
      .small { font: 500 16px Arial, sans-serif; fill: #333; text-anchor: middle; dominant-baseline: middle; }
      .edge { stroke: #444; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .label { font: 600 15px Arial, sans-serif; fill: #444; }
      .group { fill: none; stroke: #aaa; stroke-width: 1.5; stroke-dasharray: 7 7; rx: 18; }
      .groupLabel { font: 700 16px Arial, sans-serif; fill: #666; }
    </style>
  </defs>

  <text x="700" y="55" class="title" text-anchor="middle">Home Data Lifecycle</text>
  <text x="700" y="88" class="subtitle" text-anchor="middle">F-006 — Home Page</text>

  <!-- Main load -->
  <rect x="500" y="125" width="400" height="72" class="node"/>
  <text x="700" y="161" class="text">User opens /home</text>

  <polygon points="700,245 875,325 700,405 525,325" class="decision"/>
  <text x="700" y="315" class="text">Recommendations</text>
  <text x="700" y="340" class="text">already loaded?</text>

  <rect x="170" y="465" width="330" height="76" class="node"/>
  <text x="335" y="493" class="text">Load favorite preview</text>
  <text x="335" y="519" class="small">up to 4 cards</text>

  <rect x="900" y="465" width="330" height="76" class="node"/>
  <text x="1065" y="493" class="text">Load upcoming meals</text>
  <text x="1065" y="519" class="small">next 4 chronological items</text>

  <rect x="500" y="600" width="400" height="82" class="node"/>
  <text x="700" y="629" class="text">Collect displayed recipe IDs</text>
  <text x="700" y="656" class="small">favorites + upcoming meals</text>

  <rect x="500" y="745" width="400" height="94" class="node"/>
  <text x="700" y="774" class="text">GET recommended recipes</text>
  <text x="700" y="802" class="small">random compatible recipes</text>
  <text x="700" y="826" class="small">excluding displayed recipe IDs</text>

  <rect x="500" y="900" width="400" height="78" class="node"/>
  <text x="700" y="929" class="text">Cache recommendation set</text>
  <text x="700" y="955" class="small">for current authenticated session</text>

  <rect x="1000" y="275" width="300" height="74" class="node"/>
  <text x="1150" y="302" class="text">Reuse cached</text>
  <text x="1150" y="328" class="text">recommendations</text>

  <rect x="500" y="1040" width="400" height="72" class="node"/>
  <text x="700" y="1076" class="text">Render Home</text>

  <!-- Mutation group -->
  <rect x="95" y="1160" width="1210" height="220" class="group"/>
  <text x="120" y="1192" class="groupLabel">Changes after Home has loaded</text>

  <rect x="135" y="1230" width="330" height="88" class="node"/>
  <text x="300" y="1254" class="text">Favorite changed</text>
  <text x="300" y="1282" class="small">update shared favorites state</text>
  <text x="300" y="1307" class="small">refill only missing preview cards</text>

  <rect x="535" y="1230" width="330" height="88" class="node"/>
  <text x="700" y="1254" class="text">Meal plan changed</text>
  <text x="700" y="1282" class="small">mark preview stale</text>
  <text x="700" y="1307" class="small">reload next 4 meals</text>

  <rect x="935" y="1230" width="330" height="88" class="node"/>
  <text x="1100" y="1254" class="text">Diet / avoidance changed</text>
  <text x="1100" y="1282" class="small">invalidate recommendations</text>
  <text x="1100" y="1307" class="small">regenerate on next Home load</text>

  <rect x="500" y="1390" width="400" height="46" class="node"/>
  <text x="700" y="1413" class="small">Logout / identity change → clear all user-scoped Home state</text>

  <!-- Edges -->
  <path d="M700 197 L700 242" class="edge"/>
  <path d="M525 325 L335 325 L335 462" class="edge"/>
  <text x="425" y="307" class="label">No</text>

  <path d="M875 325 L997 325" class="edge"/>
  <text x="930" y="307" class="label">Yes</text>

  <path d="M335 541 L335 641 L497 641" class="edge"/>
  <path d="M1065 541 L1065 641 L903 641" class="edge"/>
  <path d="M700 682 L700 742" class="edge"/>
  <path d="M700 839 L700 897" class="edge"/>
  <path d="M700 978 L700 1037" class="edge"/>
  <path d="M1150 349 L1150 1076 L903 1076" class="edge"/>

  <path d="M700 1112 L700 1157" class="edge"/>
  <path d="M700 1157 L300 1157 L300 1227" class="edge"/>
  <path d="M700 1157 L700 1227" class="edge"/>
  <path d="M700 1157 L1100 1157 L1100 1227" class="edge"/>
</svg>
